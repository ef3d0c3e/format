name: Tests (i386)

on:
  push:
  pull_request:

jobs:
  test:
    name: Test i386 (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        compiler:
          - gcc
          - clang

    env:
      CC: ${{ matrix.compiler }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/386

      - name: Start i386 container
        run: |
          docker run -d --name build \
            --platform linux/386 \
            -e CC \
            -e DEBIAN_FRONTEND=noninteractive \
            -v "${GITHUB_WORKSPACE}:/work" \
            -w /work \
            debian:sid sleep infinity

      - name: Show architecture
        run: docker exec build linux32 sh -c 'uname -m && dpkg --print-architecture'

      - name: Install dependencies
        run: |
          docker exec build linux32 sh -euxc '
            apt-get update
            apt-get install -y --no-install-recommends \
              ca-certificates \
              git \
              make \
              "${CC}" \
              libclang-rt-dev \
              meson \
              ninja-build \
              cmake \
              pkg-config \
              libcriterion-dev \
              libgpg-error-dev \
              libzstd-dev
            git config --global --add safe.directory /work
          '

      - name: Show compiler version
        run: docker exec build linux32 sh -c '$CC --version'

      - name: Test
        run: docker exec -e ASAN_OPTIONS=detect_leaks=0 build linux32 make test EXTRA_CFLAGS='-fsanitize=address,undefined'
