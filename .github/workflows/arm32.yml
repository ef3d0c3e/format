name: Tests (arm32)

on:
  push:
  pull_request:

jobs:
  test:
    name: Test arm32 (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        compiler:
          - gcc
          - clang

    env:
      CC: ${{ matrix.compiler }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/arm/v7

      - name: Start armhf container
        run: |
          docker run -d --name build \
            --platform linux/arm/v7 \
            -e CC \
            -e DEBIAN_FRONTEND=noninteractive \
            -v "${GITHUB_WORKSPACE}:/work" \
            -w /work \
            debian:sid sleep infinity

      - name: Show architecture
        run: docker exec build sh -c 'uname -m && dpkg --print-architecture'

      - name: Install dependencies
        run: |
          docker exec build sh -euxc '
            apt-get update
            apt-get install -y --no-install-recommends \
              ca-certificates \
              git \
              make \
              "${CC}" \
              libclang-rt-dev \
              meson \
              ninja-build \
              cmake \
              pkg-config \
              libgpg-error-dev \
              libzstd-dev \
              libffi-dev \
              libgit2-dev
            git config --global --add safe.directory /work
          '

      # debian does not package libcriterion-dev, so we install it's dependencies and install it from the submodule
      - name: Build and install Criterion from submodule
        run: |
          docker exec build sh -euxc '
            cd /work/libs/criterion
            meson setup /tmp/criterion-build --prefix=/usr --buildtype=release
            ninja -C /tmp/criterion-build
            ninja -C /tmp/criterion-build install
            ldconfig
            pkg-config --modversion criterion
          '

      - name: Show compiler version
        run: docker exec build sh -c '$CC --version'

      - name: Test
        run: docker exec -e ASAN_OPTIONS=detect_leaks=0 build make test EXTRA_CFLAGS='-fsanitize=address,undefined'
